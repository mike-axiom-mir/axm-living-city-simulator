name: MergeAgent engineering navigation reconciliation

# Re-run after replacing brittle exact-y assertion with sticky non-overlap evidence.
on:
  push:
    branches:
      - mergeagent/engineering-navigation-reconcile-20260912
    paths:
      - .github/workflows/mergeagent-engineering-navigation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/engineering-navigation-reconcile-20260912
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reconcile Engineering into canonical navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/mergeagent_engineering_navigation.py
          python3 tools/mergeagent_browser_waits.py
          python3 tools/build_standalone.py
          git add src/ui.js src/engineering_ui.js tests/navigation_continuity_test.js tests/visual_presence_browser_test.py standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
          git commit -m "Integrate Engineering into canonical section navigation"
      - name: Verify deterministic and truth contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/navigation_continuity_test.js
          node tests/engineering_visuals_ui_test.js
          node tests/playable_interiors_test.js
          node tests/current_save_admission_test.js
          node tests/canonical_world_projection_test.js
          node tests/headless_runtime_intake_test.js
          npm test
          node --check src/ui.js
          node --check src/engineering_ui.js
          python3 -m py_compile tests/visual_presence_browser_test.py
          git diff --check
      - name: Exercise real Chromium section contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v chromium)"
          else
            echo "No runner Chromium/Chrome executable found" >&2
            exit 1
          fi
          python3 tests/visual_presence_browser_test.py
      - name: Finalize tested reconciliation branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mergeagent-engineering-navigation.yml tools/mergeagent_engineering_navigation.py tools/mergeagent_browser_waits.py
          git commit -m "[mergeagent-bot] Finalize Engineering navigation reconciliation"
          git push origin HEAD:mergeagent/engineering-navigation-reconcile-20260912
