name: MergeAgent regenerate Living City capability evidence

on:
  push:
    branches:
      - mergeagent/headless-package-final-20260912
    paths:
      - .github/workflows/mergeagent-regenerate-capability.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/headless-package-final-20260912
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate and verify source-bound capability evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/generate-capability-registry.cjs
          node --test tests/capability_registry.test.cjs
          node tools/generate-capability-registry.cjs --check
          git add registry/capabilities.jsonl registry/capabilities.receipt.json
          git commit -m "Regenerate capability evidence for Discovery Buddy v1"
          git rm .github/workflows/mergeagent-regenerate-capability.yml
          git commit -m "[mergeagent-bot] Finalize capability evidence regeneration"
          git push origin HEAD:mergeagent/headless-package-final-20260912
