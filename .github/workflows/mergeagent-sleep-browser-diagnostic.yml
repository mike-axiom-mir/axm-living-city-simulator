name: MergeAgent Sleep browser timing diagnostic

on:
  push:
    branches:
      - mergeagent/living-city-final-20260912
    paths:
      - .github/workflows/mergeagent-sleep-browser-diagnostic.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/living-city-final-20260912
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build exact combined browser tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "diagnostic"
          git config user.email "diagnostic@invalid.local"
          git fetch origin automation/experience-mobile-living-loop-20260910-0456 mergeagent/engineering-navigation-reconcile-20260912
          git cherry-pick 77f11c80ed4f693c7250fe7cdfa4b6039736b203
          git show origin/mergeagent/engineering-navigation-reconcile-20260912:tools/mergeagent_engineering_navigation.py > "$RUNNER_TEMP/engineering-navigation.py"
          python3 "$RUNNER_TEMP/engineering-navigation.py"
          python3 tools/build_standalone.py
      - name: Run focused Chromium timing witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v chromium)"
          else
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          from playwright.sync_api import sync_playwright

          html = Path('standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html').read_text('utf-8')
          executable = os.environ['CHROMIUM_EXECUTABLE']
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=executable, args=['--no-sandbox', '--disable-dev-shm-usage'])
              page = browser.new_page(viewport={'width': 1440, 'height': 1000})
              errors = []
              page.on('pageerror', lambda e: errors.append(f'pageerror:{e}'))
              page.on('console', lambda m: errors.append(f'console:{m.text}') if m.type == 'error' else None)
              page.set_content(html, wait_until='load')
              page.wait_for_function("() => document.querySelectorAll('.tab-button').length === 19", timeout=10000)

              page.locator('[data-action="tab"][data-id="visuals"]').click()
              active = page.locator('[role="tab"][aria-selected="true"]')
              active.press('ArrowRight')
              page.wait_for_timeout(100)
              page.locator('[data-action="speed"][data-value="24"]').click()
              page.wait_for_timeout(980)
              speed24_state = page.evaluate('''() => ({
                day: AXM.Game.world.time.day,
                hour: AXM.Game.world.time.hour,
                minute: AXM.Game.world.time.minute || 0,
                speed: AXM.Game.world.settings.simulationSpeed,
                timerNull: AXM.Game.timer === null
              })''')
              page.locator('[data-action="speed"][data-value="0"]').click()
              speed0_state = page.evaluate('''() => ({
                day: AXM.Game.world.time.day,
                hour: AXM.Game.world.time.hour,
                minute: AXM.Game.world.time.minute || 0,
                speed: AXM.Game.world.settings.simulationSpeed,
                timerNull: AXM.Game.timer === null
              })''')

              page.locator('[role="tab"][data-id="life"]').press('Home')
              page.wait_for_timeout(100)
              page.locator('[role="tab"][data-id="town"]').press('End')
              page.wait_for_timeout(100)
              page.locator('[role="tab"][data-id="visuals"]').click()
              page.wait_for_timeout(100)
              engineering = page.locator('[role="tab"][data-id="engineering"]')
              engineering.click()
              page.wait_for_timeout(120)
              engineering.press('ArrowRight')
              page.wait_for_timeout(100)
              page.locator('[role="tab"][data-id="visuals"]').click()
              page.wait_for_timeout(100)

              sleep_room = page.locator('[data-action="visual-room"]', has_text='Sleeping Room').first
              sleep_room.click()
              page.wait_for_timeout(120)
              sleep = page.locator('[data-action="visual-activity"][data-id="sleep"]')
              admission = sleep.evaluate('''(button) => {
                const request = {
                  actionId: button.dataset.id,
                  roomId: button.dataset.room || null,
                  objectId: button.dataset.object || null
                };
                const home = AXM.World.homeOf(AXM.Game.world, 'player');
                const object = request.objectId ? home?.furniture?.find((entry) => entry.id === request.objectId) : null;
                const resolved = AXM.ItemInteractions?.resolveActionObject
                  ? AXM.ItemInteractions.resolveActionObject(AXM.Game.world, request.actionId, request)
                  : null;
                return {
                  request,
                  playerLocationId: AXM.Game.world.player.locationId,
                  homeId: home?.id || null,
                  object: object ? { id: object.id, catalogId: object.catalogId, ownerId: object.ownerId, ownershipMode: object.ownershipMode } : null,
                  resolution: resolved ? { reason: resolved.reason || null, objectId: resolved.object?.id || null, catalogId: resolved.object?.catalogId || null } : null,
                  activeShift: Boolean(AXM.Game.world.activeShift)
                };
              }''')
              before = page.evaluate('''() => ({
                absolute: AXM.Game.world.time.day * 1440 + AXM.Game.world.time.hour * 60 + (AXM.Game.world.time.minute || 0),
                day: AXM.Game.world.time.day,
                hour: AXM.Game.world.time.hour,
                minute: AXM.Game.world.time.minute || 0,
                speed: AXM.Game.world.settings.simulationSpeed,
                timerNull: AXM.Game.timer === null
              })''')
              sleep.click()
              page.wait_for_timeout(180)
              after = page.evaluate('''() => ({
                absolute: AXM.Game.world.time.day * 1440 + AXM.Game.world.time.hour * 60 + (AXM.Game.world.time.minute || 0),
                day: AXM.Game.world.time.day,
                hour: AXM.Game.world.time.hour,
                minute: AXM.Game.world.time.minute || 0,
                speed: AXM.Game.world.settings.simulationSpeed,
                timerNull: AXM.Game.timer === null,
                receipt: AXM.Game.world.ui.lastVisualActivityReceipt,
                toast: AXM.Game.world.ui.toast,
                lastRenderReason: AXM.Game.world.ui.lastRenderReason,
                pendingVisualActivity: AXM.Game.world.ui.pendingVisualActivity
              })''')
              print('SPEED24_STATE', speed24_state)
              print('SPEED0_STATE', speed0_state)
              print('SLEEP_ADMISSION', admission)
              print('SLEEP_BEFORE', before)
              print('SLEEP_AFTER', after)
              print('SLEEP_DELTA', after['absolute'] - before['absolute'])
              assert not errors, errors
              browser.close()
          PY
