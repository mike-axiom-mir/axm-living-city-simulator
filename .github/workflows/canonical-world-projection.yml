name: Canonical world projection

on:
  pull_request:
  push:
    branches:
      - automation/state-architect-canonical-world-projection-20260911

permissions:
  contents: read

jobs:
  canonical-world-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check changed source syntax
        run: node --check src/core.js && node --check runtime/headless-simulator.js && node --check runtime/cli.js
      - name: Verify canonical projection contract
        run: node tests/canonical_world_projection_test.js
      - name: Verify headless runtime intake
        run: node tests/headless_runtime_intake_test.js
      - name: Run complete focused simulation suite
        run: npm test
      - name: Replay sealed intake checksums (diagnostic)
        if: matrix.node == 18
        continue-on-error: true
        run: node tools/verify_local_intake.js
