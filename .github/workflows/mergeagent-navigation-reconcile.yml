name: MergeAgent navigation reconciliation

on:
  push:
    branches:
      - mergeagent/navigation-reconcile-20260912
    paths:
      - .github/workflows/mergeagent-navigation-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/navigation-reconcile-20260912

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Reconcile exact navigation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/persistent-view-navigation-20260909-1156

          set +e
          git cherry-pick 1b3bbf661a05bc3a8f549f3a5b481dcc30e25cb7
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Cherry-pick reported conflicts:"
            git diff --name-only --diff-filter=U
            unexpected="$(git diff --name-only --diff-filter=U | grep -Ev '^(index.html|package.json|standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected semantic conflicts; fail closed:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --ours index.html package.json standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
            git add index.html package.json standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
            git cherry-pick --continue
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text('utf-8')
          html = html.replace('<div id="app" aria-live="polite"></div>', '<div id="app"></div>')
          index.write_text(html, encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text('utf-8'))
          scripts = data.setdefault('scripts', {})
          navigation = 'node tests/navigation_continuity_test.js'
          current = scripts.get('test', '')
          if navigation not in current:
              scripts['test'] = current + (' && ' if current else '') + navigation
          scripts['test:navigation'] = navigation
          data['license'] = 'Apache-2.0'
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          git add index.html package.json
          git commit -m "Reconcile navigation integration seams with v0.12" || true
          python3 tools/build_standalone.py
          git add standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild standalone after navigation reconciliation"
          fi

      - name: Verify combined navigation body
        shell: bash
        run: |
          set -euo pipefail
          node tests/navigation_continuity_test.js
          node tests/current_save_admission_test.js
          node tests/canonical_world_projection_test.js
          node tests/headless_runtime_intake_test.js
          npm test
          node --check src/ui.js
          git diff --check

      - name: Remove temporary workflow and publish tested branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mergeagent-navigation-reconcile.yml
          git commit -m "[mergeagent-bot] Finalize navigation reconciliation"
          git push origin HEAD:mergeagent/navigation-reconcile-20260912
