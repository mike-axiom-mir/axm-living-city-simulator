name: MergeAgent Engineering Chromium diagnostic

# Fast focused proof for canonical Engineering navigation only.
on:
  push:
    branches:
      - mergeagent/engineering-navigation-reconcile-20260912
    paths:
      - .github/workflows/mergeagent-engineering-browser-diagnostic.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mergeagent/engineering-navigation-reconcile-20260912
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build reconciled browser state
        run: |
          python3 tools/mergeagent_engineering_navigation.py
          python3 tools/build_standalone.py
          python3 -m py_compile tests/engineering_navigation_browser_test.py
      - name: Run focused Chromium contract
        run: |
          python3 -m pip install playwright==1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v chromium)"
          else
            exit 1
          fi
          python3 tests/engineering_navigation_browser_test.py
