name: MergeAgent final mobile Living View integration

on:
  push:
    branches:
      - mergeagent/mobile-living-final-20260912
    paths:
      - .github/workflows/mergeagent-mobile-final.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final mobile branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/mobile-living-final-20260912
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact mobile Living View commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/experience-mobile-living-loop-20260910-0456
          set +e
          git cherry-pick 77f11c80ed4f693c7250fe7cdfa4b6039736b203
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Cherry-pick conflicts:"
            git diff --name-only --diff-filter=U
            unexpected="$(git diff --name-only --diff-filter=U | grep -Ev '^(src/economy.js|standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected semantic conflicts; fail closed:"
              echo "$unexpected"
              exit 1
            fi
            if git diff --name-only --diff-filter=U | grep -qx 'src/economy.js'; then
              git checkout --ours src/economy.js
              python3 - <<'PY'
          from pathlib import Path
          p=Path('src/economy.js')
          s=p.read_text('utf-8')
          old="    Systems.toast(world, `${enterprise.name} began as an optional direction.`, 'success');"
          new="    // Starting-town businesses are background world facts. Announce a new\n    // direction only when it belongs to the directly controlled player; an\n    // NPC seed must not masquerade as the player's latest action.\n    if (ownerId === 'player') Systems.toast(world, `${enterprise.name} began as an optional direction.`, 'success');"
          if old not in s:
              if new not in s:
                  raise SystemExit('Expected player-toast seam not found; refuse broad rewrite.')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
              git add src/economy.js
            fi
            if git diff --name-only --diff-filter=U | grep -qx 'standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html'; then
              git checkout --ours standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
              git add standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
            fi
            git cherry-pick --continue
          fi

          python3 - <<'PY'
          from pathlib import Path

          engineering = Path('src/engineering_ui.js')
          s = engineering.read_text('utf-8')
          old = r'''  function decorateTabs(world) {
            const nav = UI.app?.querySelector('.tabbar');
            if (!nav) return;
            let button = nav.querySelector('[data-action="engineering-tab"]');
            if (!button) {
              button = document.createElement('button');
              button.className = 'tab-button';
              button.dataset.action = 'engineering-tab';
              button.textContent = 'Engineering';
              const anchor = nav.querySelector('[data-action="tab"][data-id="stewardship"]');
              nav.insertBefore(button, anchor || null);
            }
            nav.querySelectorAll('.tab-button').forEach((entry) => entry.classList.remove('active'));
            if (world.ui.activeTab === 'engineering') button.classList.add('active');
            else nav.querySelector(`[data-action="tab"][data-id="${String(world.ui.activeTab).replace(/"/g, '')}"]`)?.classList.add('active');
          }
          '''
          new = r'''  function decorateTabs(world) {
            const nav = UI.app?.querySelector('.tabbar');
            if (!nav) return;
            let button = nav.querySelector('[data-action="engineering-tab"]');
            if (!button) {
              button = document.createElement('button');
              button.className = 'tab-button';
              button.id = 'tab-engineering';
              button.dataset.action = 'engineering-tab';
              button.dataset.id = 'engineering';
              button.textContent = 'Engineering';
              button.setAttribute('role', 'tab');
              button.setAttribute('aria-controls', 'active-view');
              const anchor = nav.querySelector('[data-action="tab"][data-id="stewardship"]');
              nav.insertBefore(button, anchor || null);
            }
            const buttons = Array.from(nav.querySelectorAll('.tab-button'));
            buttons.forEach((entry) => {
              const active = entry.dataset.id === world.ui.activeTab;
              entry.classList.toggle('active', active);
              entry.setAttribute('role', 'tab');
              entry.setAttribute('aria-selected', String(active));
              entry.setAttribute('aria-controls', 'active-view');
              entry.tabIndex = active ? 0 : -1;
            });
            const activeIndex = Math.max(0, buttons.findIndex((entry) => entry.dataset.id === world.ui.activeTab));
            const position = UI.app?.querySelector('.view-position');
            if (position) {
              position.innerHTML = `${activeIndex + 1}<i>/</i>${buttons.length}`;
              position.setAttribute('aria-label', `Section ${activeIndex + 1} of ${buttons.length}`);
            }
            const main = UI.app?.querySelector('#active-view');
            if (main) main.setAttribute('aria-labelledby', `tab-${world.ui.activeTab}`);
          }
          '''
          if old not in s:
              if new not in s:
                  raise SystemExit('Expected Engineering tab decoration seam not found; refuse broad rewrite.')
          else:
              s = s.replace(old, new, 1)

          old_bind = r'''      if (tab) {
                event.preventDefault();
                Game.setTab('engineering');
                return;
              }
          '''
          new_bind = r'''      if (tab) {
                event.preventDefault();
                if (typeof UI.activateTab === 'function') UI.activateTab('engineering');
                else Game.setTab('engineering');
                return;
              }
          '''
          if old_bind not in s:
              if new_bind not in s:
                  raise SystemExit('Expected Engineering click seam not found; refuse broad rewrite.')
          else:
              s = s.replace(old_bind, new_bind, 1)

          old_install = '''  installStyles();
            installSystemBridges();

            const originalBindEvents = UI.bindEvents;
          '''
          new_install = '''  installStyles();
            installSystemBridges();

            const originalNavigationTarget = typeof UI.navigationTarget === 'function' ? UI.navigationTarget : null;
            if (originalNavigationTarget) {
              UI.navigationTarget = function navigationTargetWithEngineering(currentId, key) {
                const ids = Array.from(this.app?.querySelectorAll('.tabbar .tab-button') || [])
                  .map((entry) => entry.dataset.id)
                  .filter(Boolean);
                if (!ids.includes('engineering') || !ids.includes(currentId)) {
                  return originalNavigationTarget.call(this, currentId, key);
                }
                const index = ids.indexOf(currentId);
                if (key === 'Home') return ids[0];
                if (key === 'End') return ids[ids.length - 1];
                if (key === 'ArrowRight') return ids[(index + 1) % ids.length];
                if (key === 'ArrowLeft') return ids[(index - 1 + ids.length) % ids.length];
                return null;
              };
            }

            const originalActivateTab = typeof UI.activateTab === 'function' ? UI.activateTab : null;
            if (originalActivateTab) {
              UI.activateTab = function activateTabWithEngineering(tabId, focusTab = true) {
                if (tabId === 'engineering') {
                  if (focusTab) this.pendingFocusKey = 'tab:engineering';
                  Game.setTab('engineering');
                  return;
                }
                return originalActivateTab.call(this, tabId, focusTab);
              };
            }

            const originalBindEvents = UI.bindEvents;
          '''
          if old_install not in s:
              if new_install not in s:
                  raise SystemExit('Expected Engineering navigation install seam not found; refuse broad rewrite.')
          else:
              s = s.replace(old_install, new_install, 1)
          engineering.write_text(s, encoding='utf-8')

          test = Path('tests/visual_presence_browser_test.py')
          t = test.read_text('utf-8')
          old_wait = "        page.wait_for_timeout(300)\n\n        assert page.locator('.tab-button').count() == 18"
          new_wait = "        page.wait_for_function(\"() => document.querySelectorAll('.tab-button').length === 19\", timeout=10000)\n\n        assert page.locator('.tab-button').count() == 19\n        engineering_tab = page.locator('[data-action=\"engineering-tab\"]')\n        assert engineering_tab.count() == 1\n        assert engineering_tab.get_attribute('role') == 'tab'\n        assert engineering_tab.get_attribute('data-id') == 'engineering'\n        assert engineering_tab.get_attribute('aria-selected') == 'false'\n        assert engineering_tab.get_attribute('tabindex') == '-1'\n        assert page.locator('.view-position').get_attribute('aria-label') == 'Section 5 of 19'"
          if old_wait not in t:
              if new_wait not in t:
                  raise SystemExit('Expected browser readiness seam not found; refuse broad rewrite.')
          else:
              t = t.replace(old_wait, new_wait, 1)

          anchor = "        assert page.locator('[data-action=\"visual-activity\"]').count() >= 1\n\n        # The 18-view rail is one roving tab stop, supports standard tab keys,\n"
          replacement = "        assert page.locator('[data-action=\"visual-activity\"]').count() >= 1\n\n        # The v0.12 Engineering extension participates in the same roving-tab contract.\n        economy_tab = page.locator('[role=\"tab\"][data-id=\"economy\"]')\n        economy_tab.focus()\n        economy_tab.press('ArrowRight')\n        page.wait_for_timeout(100)\n        assert page.locator('[role=\"tab\"][aria-selected=\"true\"]').get_attribute('data-id') == 'engineering'\n        assert page.evaluate('() => document.activeElement?.dataset?.id') == 'engineering'\n        assert page.locator('.view-position').get_attribute('aria-label') == 'Section 14 of 19'\n        page.locator('[role=\"tab\"][data-id=\"engineering\"]').press('ArrowRight')\n        page.wait_for_timeout(100)\n        assert page.locator('[role=\"tab\"][aria-selected=\"true\"]').get_attribute('data-id') == 'stewardship'\n        page.locator('[role=\"tab\"][data-id=\"visuals\"]').click()\n        page.wait_for_timeout(100)\n\n        # The complete rail is one roving tab stop, supports standard tab keys,\n"
          if anchor not in t:
              if replacement not in t:
                  raise SystemExit('Expected navigation browser assertion seam not found; refuse broad rewrite.')
          else:
              t = t.replace(anchor, replacement, 1)
          test.write_text(t, encoding='utf-8')
          PY
          git add src/engineering_ui.js tests/visual_presence_browser_test.py
          if ! git diff --cached --quiet; then git commit -m "Integrate Engineering into human-context navigation"; fi

          python3 tools/build_standalone.py
          git add standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
          if ! git diff --cached --quiet; then git commit -m "Rebuild standalone after mobile Living View integration"; fi
      - name: Verify mobile/gamefeel contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/playable_interiors_test.js
          node tests/local_economy_test.js
          node tests/navigation_continuity_test.js
          node tests/autosave_conflict_experience_test.js
          node tests/autosave_clear_recovery_experience_test.js
          node tests/identity_cursor_contract_test.js
          node tests/current_save_admission_test.js
          node tests/canonical_world_projection_test.js
          node tests/headless_runtime_intake_test.js
          npm test
          node --check src/ui.js
          node --check src/engineering_ui.js
          node --check src/economy.js
          python3 -m py_compile tests/visual_presence_browser_test.py
          git diff --check
      - name: Exercise real Chromium mobile loop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v chromium)"
          else
            echo "No runner Chromium/Chrome executable found" >&2
            exit 1
          fi
          python3 tests/visual_presence_browser_test.py
      - name: Finalize tested mobile branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mergeagent-mobile-final.yml
          git commit -m "[mergeagent-bot] Finalize mobile Living View integration"
          git push origin HEAD:mergeagent/mobile-living-final-20260912
