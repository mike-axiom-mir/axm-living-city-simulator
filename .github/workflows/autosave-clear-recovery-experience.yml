name: Autosave clear recovery experience

on:
  pull_request:
  push:
    branches:
      - automation/experience-clear-transaction-recovery-20260911

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check changed experience syntax
        run: node --check src/autosave_clear_recovery_ui.js
      - name: Verify clear-recovery experience projection
        run: node tests/autosave_clear_recovery_experience_test.js
      - name: Verify recoverable clear prerequisite
        run: node tests/autosave_clear_transaction_test.js
      - name: Verify stale writer prerequisite
        run: node tests/autosave_stale_writer_test.js
      - name: Verify autosave candidate recovery prerequisite
        run: node tests/autosave_candidate_recovery_test.js
      - name: Verify current-save admission prerequisite
        run: node tests/current_save_admission_test.js
      - name: Verify headless runtime contract
        run: node tests/headless_runtime_intake_test.js
      - name: Run complete focused simulation suite
        run: npm test
      - name: Replay sealed intake checksums (diagnostic)
        if: matrix.node == 20
        continue-on-error: true
        run: node tools/verify_local_intake.js
