name: Autosave conflict experience

on:
  pull_request:
  push:
    branches:
      - automation/experience-autosave-conflict-recovery-20260909

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check changed experience syntax
        run: node --check src/autosave_conflict_ui.js
      - name: Verify autosave conflict experience projection
        run: node tests/autosave_conflict_experience_test.js
      - name: Verify stale writer prerequisite
        run: node tests/autosave_stale_writer_test.js
      - name: Verify autosave candidate recovery prerequisite
        run: node tests/autosave_candidate_recovery_test.js
      - name: Verify current-save admission prerequisite
        run: node tests/current_save_admission_test.js
      - name: Verify headless runtime contract
        run: node tests/headless_runtime_intake_test.js
      - name: Run complete focused simulation suite
        run: npm test
      - name: Replay sealed intake checksums (diagnostic)
        if: matrix.node == 20
        continue-on-error: true
        run: node tools/verify_local_intake.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact offline standalone
        run: python3 tools/build_standalone.py
      - name: Install browser QA harness only
        run: python3 -m pip install playwright==1.55.0
      - name: Resolve bundled runner browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No runner Chromium/Chrome executable found" >&2
            exit 1
          fi
      - name: Exercise stale-autosave recovery in Chromium
        run: python3 tests/autosave_conflict_browser_test.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosave-conflict-experience
          path: artifacts/autosave-conflict-*.png
          if-no-files-found: warn
