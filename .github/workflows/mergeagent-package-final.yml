name: MergeAgent final headless package reconciliation

on:
  push:
    branches:
      - mergeagent/headless-package-final-20260912
    paths:
      - .github/workflows/mergeagent-package-final.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package reconciliation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/headless-package-final-20260912
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate source-bound capability evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/generate-capability-registry.cjs
          git add registry/capabilities.jsonl registry/capabilities.receipt.json
          if ! git diff --cached --quiet; then git commit -m "Regenerate Living City capability registry from final package bytes"; fi
      - name: Verify package and current Living City contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:headless
          npm run test:package
          npm run test:capability-registry
          npm run capabilities:check
          node tests/current_save_admission_test.js
          node tests/canonical_world_projection_test.js
          node tests/identity_cursor_contract_test.js
          node tests/navigation_continuity_test.js
          node tests/autosave_conflict_experience_test.js
          node tests/autosave_clear_recovery_experience_test.js
          npm test
          git diff --check
      - name: Finalize tested package branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mergeagent-package-final.yml
          git commit -m "[mergeagent-bot] Finalize headless package reconciliation"
          git push origin HEAD:mergeagent/headless-package-final-20260912
