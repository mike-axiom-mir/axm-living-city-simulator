name: MergeAgent permission-aligned final Living City gate

on:
  push:
    branches:
      - mergeagent/living-city-final-20260912
    paths:
      - .github/workflows/mergeagent-living-city-final-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: mergeagent/living-city-final-20260912

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Assemble final semantic tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin automation/experience-mobile-living-loop-20260910-0456 mergeagent/engineering-navigation-reconcile-20260912
          git cherry-pick 77f11c80ed4f693c7250fe7cdfa4b6039736b203

          # Reuse the already browser-proven Engineering-navigation patch logic.
          git show origin/mergeagent/engineering-navigation-reconcile-20260912:tools/mergeagent_engineering_navigation.py > "$RUNNER_TEMP/engineering-navigation.py"
          python3 "$RUNNER_TEMP/engineering-navigation.py"

          # Align visual quick actions with the already-authoritative item permission layer.
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Expected {label} anchor missing; refuse broad rewrite.')
              return text.replace(old, new, 1)

          visuals = Path('src/visuals.js')
          s = visuals.read_text('utf-8')
          s = replace_once(
              s,
              "      ownerId: object.ownerId || null,\n      historyCount: Array.isArray(object.history) ? object.history.length : 0,",
              "      ownerId: object.ownerId || null,\n      ownershipMode: object.ownershipMode || null,\n      historyCount: Array.isArray(object.history) ? object.history.length : 0,",
              'visual object ownership projection',
          )
          s = replace_once(
              s,
              "  function ruleObject(rule, objects) {\n    if (!rule.kinds.length) return null;\n    return objects.find((object) => rule.kinds.includes(object.kind)) || null;\n  }",
              "  function ruleObject(rule, objects) {\n    if (!rule.kinds.length) return null;\n    return objects.find((object) => {\n      if (!rule.kinds.includes(object.kind)) return false;\n      const itemInteractions = AXM.ItemInteractions;\n      if (itemInteractions?.objectMatchesAction && !itemInteractions.objectMatchesAction(object, rule.actionId)) return false;\n      if (itemInteractions?.directUseAllowed && !itemInteractions.directUseAllowed(object)) return false;\n      return true;\n    }) || null;\n  }",
              'permission-aware visual object selector',
          )
          s = replace_once(
              s,
              "      const objectMatch = Boolean(object);\n      if (!objectMatch && !purposeMatch && !utilityMatch) return [];\n      const activity = Content.activityById(rule.actionId);",
              "      const objectMatch = Boolean(object);\n      const itemObjectRequired = Boolean(AXM.ItemInteractions?.ACTION_CATALOGS?.[rule.actionId]?.length);\n      if (itemObjectRequired && !objectMatch) return [];\n      if (!objectMatch && !purposeMatch && !utilityMatch) return [];\n      const activity = Content.activityById(rule.actionId);",
              'permission-required visual activity admission',
          )
          visuals.write_text(s, encoding='utf-8')

          # Browser QA must select a sleeping room that actually exposes a lawful Sleep action.
          browser = Path('tests/visual_presence_browser_test.py')
          s = browser.read_text('utf-8')
          old = '''        sleep_room = page.locator('[data-action="visual-room"]', has_text='Sleeping Room').first
                  sleep_room.click()
                  page.wait_for_timeout(120)
                  sleep_action = page.locator('[data-action="visual-activity"][data-id="sleep"]')
                  assert sleep_action.count() == 1
          '''
          new = '''        sleep_action = page.locator('[data-action="visual-activity"][data-id="sleep"]')
                  sleep_rooms = page.locator('[data-action="visual-room"]')
                  lawful_sleep_room_found = False
                  for room_index in range(sleep_rooms.count()):
                      candidate = sleep_rooms.nth(room_index)
                      candidate.click()
                      page.wait_for_timeout(80)
                      if sleep_action.count() == 1:
                          lawful_sleep_room_found = True
                          break
                  assert lawful_sleep_room_found, 'No lawful room/object combination exposed the grounded Sleep action.'
                  assert sleep_action.count() == 1
          '''
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected browser Sleep selection seam missing; refuse broad rewrite.')
              s = s.replace(old, new, 1)
          browser.write_text(s, encoding='utf-8')
          PY

          cat > tests/visual_activity_permission_test.js <<'JS'
          'use strict';

          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { loadSimulation } = require('../runtime/load-simulation');

          const axm = loadSimulation();
          require(path.join(__dirname, '..', 'src', 'visuals.js'));
          const { World, Systems, Visuals, ItemInteractions, Habitats } = axm;

          const world = World.createWorld('AXM-VISUAL-PERMISSION-ALIGNMENT');
          Systems.updateNpcSchedules(world);
          Visuals.ensureUiState(world);
          Systems.advanceHours(world, 24);

          const home = World.homeOf(world, 'player');
          let sleepOptions = 0;
          let personalForeignBeds = 0;
          for (const room of home.habitat.rooms.filter((entry) => entry.purpose === 'sleep')) {
            world.ui.visualSceneMode = 'room';
            world.ui.selectedVisualRoomId = room.id;
            const scene = Visuals.sceneFor(world, 'room');
            const rawObjects = home.furniture.filter((object) => Habitats.roomAtCell(home, object.position?.x, object.position?.y)?.id === room.id);
            personalForeignBeds += rawObjects.filter((object) => /bed|mattress/.test(object.catalogId) && object.ownerId !== 'player' && object.ownershipMode !== 'property_fixture').length;
            const sleep = scene.activities.find((entry) => entry.id === 'sleep') || null;
            if (!sleep) continue;
            sleepOptions += 1;
            assert.ok(sleep.objectId, 'Sleep quick action must bind a concrete permitted bed/mattress.');
            const object = home.furniture.find((entry) => entry.id === sleep.objectId);
            assert.ok(object, 'Visual Sleep object must exist in the selected home.');
            assert.equal(Habitats.roomAtCell(home, object.position?.x, object.position?.y)?.id, room.id, 'Visual Sleep object must belong to the selected room.');
            assert.equal(ItemInteractions.objectMatchesAction(object, 'sleep'), true, 'Visual Sleep object must satisfy the item-action catalogue.');
            assert.equal(ItemInteractions.directUseAllowed(object), true, 'Visual Sleep object must pass the existing player-use permission rule.');
            const request = { actionId: 'sleep', roomId: room.id, objectId: sleep.objectId };
            const resolved = ItemInteractions.resolveActionObject(world, 'sleep', request);
            assert.equal(resolved.reason, null, 'Advertised Sleep quick action must be admitted by Item Interactions.');
            assert.equal(resolved.object?.id, sleep.objectId);
          }

          assert.ok(personalForeignBeds > 0, 'Regression seed should include at least one other resident personal bed.');
          assert.ok(sleepOptions > 0, 'At least one lawful grounded Sleep option should remain available.');
          console.log(`PASS visual activity permission alignment: ${sleepOptions} lawful Sleep option(s), ${personalForeignBeds} foreign personal bed(s) excluded`);
          JS

          python3 tools/build_standalone.py
          git add src/visuals.js tests/visual_activity_permission_test.js tests/visual_presence_browser_test.py src/ui.js src/engineering_ui.js styles.css src/economy.js tests/navigation_continuity_test.js tests/playable_interiors_test.js standalone/AXM_LIVING_CITY_SIM_INTERIOR_FEEDBACK_v0_11_3.html
          git commit -m "Align Living View affordances with object permissions"

      - name: Verify combined deterministic contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/visual_activity_permission_test.js
          node tests/navigation_continuity_test.js
          node tests/playable_interiors_test.js
          node tests/local_economy_test.js
          node tests/autosave_conflict_experience_test.js
          node tests/autosave_clear_recovery_experience_test.js
          node tests/identity_cursor_contract_test.js
          node tests/current_save_admission_test.js
          node tests/canonical_world_projection_test.js
          node tests/headless_runtime_intake_test.js
          npm run test:package
          npm run test:capability-registry
          npm run capabilities:check
          npm test
          node --check src/visuals.js
          node --check src/ui.js
          node --check src/engineering_ui.js
          node --check src/economy.js
          python3 -m py_compile tests/visual_presence_browser_test.py
          git diff --check

      - name: Exercise real Chromium desktop and mobile loop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright==1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROMIUM_EXECUTABLE="$(command -v chromium)"
          else
            echo "No runner Chromium/Chrome executable found" >&2
            exit 1
          fi
          python3 tests/visual_presence_browser_test.py

      - name: Exercise corrected Discovery Buddy bridge
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mike-axiom-mir/axm-discovery-buddy.git "$RUNNER_TEMP/discovery-buddy"
          git -C "$RUNNER_TEMP/discovery-buddy" checkout --quiet a1e28aba31c453023298e01ce4e54107c3f74583
          mkdir -p "$RUNNER_TEMP/provider-workspace"
          git worktree add --detach "$RUNNER_TEMP/provider-workspace/living-city" HEAD
          export PYTHONPATH="$RUNNER_TEMP/discovery-buddy"
          python -m discovery_buddy scan "$RUNNER_TEMP/provider-workspace" --public --output-dir "$RUNNER_TEMP/living-city-discovery"
          python -m discovery_buddy verify "$RUNNER_TEMP/provider-workspace" --public --output-dir "$RUNNER_TEMP/living-city-discovery"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          index = json.loads((root / 'living-city-discovery/public-discovery.json').read_text('utf-8'))
          assert index['summary']['repositories'] == 1
          assert index['summary']['capability_records'] == 1
          record = index['repositories'][0]['capabilities']['records'][0]
          assert record['id'] == 'axm.living-city.headless-simulator.v1'
          assert record['providers'] == ['axm-living-city-simulator']
          print('PASS corrected Living City -> Discovery Buddy workspace bridge')
          PY

      - name: Finalize tested branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mergeagent-living-city-final.yml
          git rm .github/workflows/mergeagent-sleep-browser-diagnostic.yml
          git rm .github/workflows/mergeagent-living-city-final-v2.yml
          git commit -m "[mergeagent-bot] Finalize Living City reconciliation"
          git push origin HEAD:mergeagent/living-city-final-20260912
